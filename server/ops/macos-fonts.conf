<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  server/ops/macos-fonts.conf — fontconfig 配置：让 Linux server 端的 generic
  font family（serif / sans-serif / monospace / system-ui）落到 macOS 字体上。

  目的：PDF/PPT 导出走 server 端 Playwright Chromium，agent 写的 css
    `font-family: 'X', serif` / `'X', sans-serif` 等 generic fallback 在
  Linux 默认会命中 Liberation Serif / DejaVu Sans，跟用户 Mac preview 看到的
  Songti SC / PingFang SC 完全不一样。装上 macOS 字体 + 这份 fontconfig 后，
  generic family 会优先命中苹果字体，server 端字体跟 preview 1:1 对齐。

  生效路径：复制此文件到 /etc/fonts/conf.d/99-macos.conf，跑 fc-cache -fv
  （install-macos-fonts.sh 会自动做）。

  ⚠️ 法律：苹果字体（PingFang / Songti / SF Pro）是 Apple 商业授权字体，
  仅限内部使用，禁止打包进面向最终用户的产物（baked HTML 不内联这些字体）。
  这份配置只影响 server 端渲染（PDF/PPT），不会让字体随 deck 外传。
-->
<fontconfig>

  <!-- ── 1. generic serif → 优先 macOS 宋体类 ── -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Songti SC</family>
      <family>STSong</family>
      <family>Noto Serif SC</family>
      <family>Source Han Serif SC</family>
    </prefer>
  </alias>

  <!-- ── 2. generic sans-serif → 优先 PingFang SC ── -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>PingFang SC</family>
      <family>Heiti SC</family>
      <family>Noto Sans SC</family>
      <family>Source Han Sans SC</family>
    </prefer>
  </alias>

  <!-- ── 3. system-ui → SF Pro + PingFang（mac 系统字体栈） ── -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>San Francisco</family>
      <family>PingFang SC</family>
    </prefer>
  </alias>

  <!-- ── 4. monospace → mac 系统等宽 ── -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>Menlo</family>
      <family>Monaco</family>
      <family>JetBrains Mono</family>
    </prefer>
  </alias>

  <!-- ── 5. 几个常见 latin family alias → 让 css 里写名也能命中 ── -->

  <!-- Helvetica / Helvetica Neue → 用 macOS 自带（如果没装苹果 Helvetica，
       fontconfig 会自动 fallback 到下一个） -->
  <alias>
    <family>Helvetica</family>
    <prefer>
      <family>Helvetica Neue</family>
      <family>Arial</family>
      <family>PingFang SC</family>
    </prefer>
  </alias>

  <!-- 通用 CJK fallback：任何字体在 CJK 字符上找不到 glyph 时走 PingFang -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <family>PingFang SC</family>
      <family>Songti SC</family>
      <family>Heiti SC</family>
      <family>Noto Sans SC</family>
    </edit>
  </match>

</fontconfig>
