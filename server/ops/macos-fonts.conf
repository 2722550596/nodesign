<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  server/ops/macos-fonts.conf — fontconfig 配置：让 Linux server 端的 generic
  font family（serif / sans-serif / monospace / system-ui）落到 macOS 字体上。

  目的：PDF/PPT 导出走 server 端 Playwright Chromium，agent 写的 css
  `font-family: 'X', serif` / `'X', sans-serif` 等 generic fallback 在 Linux
  默认会命中 DejaVu / Liberation，跟用户 Mac preview 看到的 Songti SC /
  PingFang SC 完全不一样。装上 macOS 字体 + 这份 fontconfig 后，generic family
  会优先命中苹果字体，server 端字体跟 preview 1:1 对齐。

  ⚠️ alias 写法：必须用 `<match target="pattern">` + `mode="prepend"` +
  `binding="strong"`。`<alias><prefer>` 那种语法只是"添加到 fallback list"，
  会被 Debian/Ubuntu 默认的 60-latin.conf / 45-generic.conf 等规则压在后面，
  实际 fc-match 命中 DejaVu 而不是苹果字体。prepend strong 才能顶到第一位。

  生效路径：复制此文件到 /etc/fonts/conf.d/99-macos.conf，跑 fc-cache -fv
  （install-macos-fonts.sh 会自动做）。

  ⚠️ 法律：苹果字体（PingFang / Songti / SF Pro）是 Apple 商业授权字体，
  仅限内部使用，禁止打包进面向最终用户的产物（baked HTML 不内联这些字体）。
  这份配置只影响 server 端渲染（PDF/PPT），不会让字体随 deck 外传。
-->
<fontconfig>

  <!-- ── 1. generic serif → 强制 prepend Songti SC ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Songti SC</string>
      <string>STSong</string>
      <string>Noto Serif SC</string>
    </edit>
  </match>

  <!-- ── 2. generic sans-serif → 强制 prepend PingFang SC ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>PingFang SC</string>
      <string>Heiti SC</string>
      <string>Noto Sans SC</string>
    </edit>
  </match>

  <!-- ── 3. system-ui → SF Pro + PingFang（mac 系统字体栈） ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>.SF NS</string>
      <string>.SF NS Text</string>
      <string>.SFNS-Regular</string>
      <string>San Francisco</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- ── 4. -apple-system / BlinkMacSystemFont → 同 system-ui ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>.SF NS</string>
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Text</string>
      <string>.SF NS</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- ── 5. monospace → mac 系统等宽 ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Mono</string>
      <string>.SF NS Mono</string>
      <string>Menlo</string>
      <string>Monaco</string>
    </edit>
  </match>

  <!-- ── 6. Helvetica / Helvetica Neue → 用 macOS 自带 ── -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Helvetica Neue</string>
      <string>Helvetica</string>
    </edit>
  </match>

  <!-- ── 7. 任何字体在 CJK 字符上找不到 glyph 时强制 fallback PingFang ── -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>PingFang SC</string>
      <string>Songti SC</string>
      <string>Heiti SC</string>
    </edit>
  </match>

</fontconfig>
