<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  server/ops/macos-fonts.conf — fontconfig 配置：让 Linux server 端的 generic
  font family（serif / sans-serif / monospace / system-ui / -apple-system /
  BlinkMacSystemFont）落到 macOS 字体上。

  ⚠️ 文件加载顺序（关键）：必须装在 /etc/fonts/conf.d/65-macos.conf。
  - 60-latin.conf：把 sans-serif → DejaVu/Liberation 等 latin alias
  - 65-macos.conf（本文件）：在 latin 之后强 prepend macOS 字体
  - 69-language-selector-*.conf：lang-specific 中文/日文 alias
  - 99-* 顺序最后，如果放 99 反而被 69-language-selector-zh-cn.conf 反 override

  ⚠️ alias 写法：必须用 `<match target="pattern">` + `mode="prepend_first"`。
  prepend_first 是 fontconfig 文档里 "force strong binding + insert at head"
  最高优先级写法。`<alias><prefer>` 和 `prepend + binding=strong` 都不够狠，
  会被 Debian/Ubuntu 默认规则压在后面（实测 fc-match sans-serif:lang=zh-cn
  仍命中 Helvetica Neue）。

  ⚠️ lang=zh 的 sans-serif/system-ui 必须有显式复合 match——光 prepend
  PingFang 到 sans-serif 不够，因为 fontconfig 处理 lang=zh 时会用 charset
  覆盖率重新排序，把没中文 glyph 的 latin 字体（Helvetica Neue）反而排前。
  显式复合 match (sans-serif AND lang contains zh) 强 prepend，能盖过这条。

  ⚠️ 法律：苹果字体（PingFang / Songti / SF Pro）是 Apple 商业授权字体，
  仅限内部使用，禁止打包进面向最终用户的产物（baked HTML 不内联这些字体）。
  这份配置只影响 server 端渲染（PDF/PPT），不会让字体随 deck 外传。
-->
<fontconfig>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第一组：generic family alias（lang 无关，统一 prepend 苹果字体）        -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- generic serif → Songti SC（中文衬线宋体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Songti SC</string>
      <string>STSong</string>
    </edit>
  </match>

  <!-- generic sans-serif → PingFang SC（中文黑体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
      <string>Heiti SC</string>
    </edit>
  </match>

  <!-- system-ui → SF Pro（macOS 系统 UI 字体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>.SF NS Text</string>
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- -apple-system / BlinkMacSystemFont → 同 system-ui -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>SF Pro Text</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>SF Pro Text</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- monospace → SF Mono / Menlo -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS Mono</string>
      <string>SF Mono</string>
      <string>Menlo</string>
      <string>Monaco</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第二组：lang=zh 复合 match（强制中文字符走 PingFang/Songti）            -->
  <!--                                                                      -->
  <!-- 必要性：第一组 prepend 把 PingFang 放 list 前面，但 fontconfig 处理     -->
  <!-- lang=zh 时会用"charset 覆盖率"重新排序，没中文 glyph 的 latin 字体     -->
  <!-- 反而排前。显式复合 match 强 prepend 中文字体，盖过 charset 重排。      -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- sans-serif:lang=zh → 强制 PingFang SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- serif:lang=zh → 强制 Songti SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Songti SC</string>
    </edit>
  </match>

  <!-- system-ui / -apple-system :lang=zh → PingFang SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第三组：通用 CJK fallback（任何字体在 zh charset 缺 glyph 时 append）  -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>PingFang SC</string>
      <string>Songti SC</string>
      <string>Heiti SC</string>
      <string>Noto Sans SC</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第四组：Helvetica 别名（让 css 写 Helvetica 命中 macOS 自带）           -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Helvetica Neue</string>
    </edit>
  </match>

</fontconfig>
