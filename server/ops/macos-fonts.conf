<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  server/ops/macos-fonts.conf — fontconfig 配置：让 Linux server 端的 generic
  font family（serif / sans-serif / monospace / system-ui / -apple-system /
  BlinkMacSystemFont）落到 macOS 字体上。

  ⚠️ 文件加载顺序（关键）：必须装在 /etc/fonts/conf.d/65-macos.conf。
  - 60-latin.conf：把 sans-serif → DejaVu/Liberation 等 latin alias
  - 65-macos.conf（本文件）：在 latin 之后强 prepend macOS 字体
  - 69-language-selector-*.conf：lang-specific 中文/日文 alias
  - 99-* 顺序最后，如果放 99 反而被 69-language-selector-zh-cn.conf 反 override

  ⚠️ alias 写法：必须用 `<match target="pattern">` + `mode="prepend_first"`。
  prepend_first 是 fontconfig 文档里 "force strong binding + insert at head"
  最高优先级写法。`<alias><prefer>` 和 `prepend + binding=strong` 都不够狠，
  会被 Debian/Ubuntu 默认规则压在后面（实测 fc-match sans-serif:lang=zh-cn
  仍命中 Helvetica Neue）。

  ⚠️ lang=zh 的 sans-serif/system-ui 必须有显式复合 match——光 prepend
  PingFang 到 sans-serif 不够，因为 fontconfig 处理 lang=zh 时会用 charset
  覆盖率重新排序，把没中文 glyph 的 latin 字体（Helvetica Neue）反而排前。
  显式复合 match (sans-serif AND lang contains zh) 强 prepend，能盖过这条。

  ⚠️ 法律：苹果字体（PingFang / Songti / SF Pro）是 Apple 商业授权字体，
  仅限内部使用，禁止打包进面向最终用户的产物（baked HTML 不内联这些字体）。
  这份配置只影响 server 端渲染（PDF/PPT），不会让字体随 deck 外传。
-->
<fontconfig>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第一组：generic family alias（lang 无关，统一 prepend 苹果字体）        -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- generic serif → Songti SC（中文衬线宋体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Songti SC</string>
      <string>STSong</string>
    </edit>
  </match>

  <!-- generic sans-serif → PingFang SC（中文黑体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
      <string>Heiti SC</string>
    </edit>
  </match>

  <!-- system-ui → SF Pro（macOS 系统 UI 字体） -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>.SF NS Text</string>
      <string>SF Pro Text</string>
      <string>SF Pro Display</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- -apple-system / BlinkMacSystemFont → 同 system-ui -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>SF Pro Text</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS</string>
      <string>SF Pro Text</string>
      <string>Helvetica Neue</string>
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- monospace → SF Mono / Menlo -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>.SF NS Mono</string>
      <string>SF Mono</string>
      <string>Menlo</string>
      <string>Monaco</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第二组：lang=zh 复合 match（强制中文字符走 PingFang/Songti）            -->
  <!--                                                                      -->
  <!-- 必要性：第一组 prepend 把 PingFang 放 list 前面，但 fontconfig 处理     -->
  <!-- lang=zh 时会用"charset 覆盖率"重新排序，没中文 glyph 的 latin 字体     -->
  <!-- 反而排前。显式复合 match 强 prepend 中文字体，盖过 charset 重排。      -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- sans-serif:lang=zh → 强制 PingFang SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- serif:lang=zh → 强制 Songti SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Songti SC</string>
    </edit>
  </match>

  <!-- system-ui / -apple-system :lang=zh → PingFang SC 在最前 -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>PingFang SC</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第三组：通用 CJK fallback（任何字体在 zh charset 缺 glyph 时 append）  -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <match target="pattern">
    <test name="lang" compare="contains">
      <string>zh</string>
    </test>
    <edit name="family" mode="append" binding="strong">
      <string>PingFang SC</string>
      <string>Songti SC</string>
      <string>Heiti SC</string>
      <string>Noto Sans SC</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第四组：Helvetica 别名（让 css 写 Helvetica 命中 macOS 自带）           -->
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <match target="pattern">
    <test qual="any" name="family">
      <string>Helvetica</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Helvetica Neue</string>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第五组：剔除 Helvetica/Helvetica Neue 的 CJK lang 声明                -->
  <!--                                                                      -->
  <!-- Helvetica.ttc / HelveticaNeue.ttc 内部声明支持很多语言（macOS 用     -->
  <!-- "中黑" 这种 style 名让 fontconfig 误识为它支持 zh），fc-match         -->
  <!-- :lang=zh-cn 命中前 4 位都是 Helvetica Neue 各 style，PingFang 排第 5。-->
  <!--                                                                      -->
  <!-- 解法：用 target="font" 改写 Helvetica/Helvetica Neue 的 lang 集合，   -->
  <!-- assign_replace 为只 latin 语言，剔除 zh/ja/ko。fontconfig 在 query   -->
  <!-- :lang=zh 时就不会把它们纳入候选，PingFang 自然顶到第 1 位。           -->
  <!--                                                                      -->
  <!-- 副作用：css 显式写 font-family: 'Helvetica Neue' 时 latin 字符仍命中  -->
  <!-- Helvetica Neue（family 优先级 > lang），中文字符 fallback 到 PingFang。-->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <match target="font">
    <test name="family">
      <string>Helvetica Neue</string>
    </test>
    <edit name="lang" mode="assign_replace" binding="strong">
      <langset>
        <string>en</string>
        <string>fr</string>
        <string>de</string>
        <string>es</string>
        <string>it</string>
        <string>pt</string>
        <string>ru</string>
        <string>nl</string>
        <string>sv</string>
        <string>no</string>
        <string>da</string>
        <string>fi</string>
        <string>pl</string>
        <string>tr</string>
      </langset>
    </edit>
  </match>
  <match target="font">
    <test name="family">
      <string>Helvetica</string>
    </test>
    <edit name="lang" mode="assign_replace" binding="strong">
      <langset>
        <string>en</string>
        <string>fr</string>
        <string>de</string>
        <string>es</string>
        <string>it</string>
        <string>pt</string>
        <string>ru</string>
        <string>nl</string>
        <string>sv</string>
        <string>no</string>
        <string>da</string>
        <string>fi</string>
        <string>pl</string>
        <string>tr</string>
      </langset>
    </edit>
  </match>

  <!-- ══════════════════════════════════════════════════════════════════ -->
  <!-- 第六组：reject Linux 系统字体——server 端只剩苹果字体可选              -->
  <!--                                                                      -->
  <!-- 之前现象：fc-match -s sans-serif:lang=zh-cn 输出 list 里 Helvetica   -->
  <!-- Neue 各 style 占前 4 位，PingFang 在第 5。Chromium 字符级 fallback   -->
  <!-- 链不一定能走到 PingFang——某些字符就 fallback 到 DejaVu Sans 或方块。 -->
  <!--                                                                      -->
  <!-- 干净方案：直接把 Debian/Ubuntu 自带的 latin/CJK 系统字体全 reject，   -->
  <!-- server 端字体池只剩苹果字体（PingFang/Songti/Helvetica/SF NS/Menlo） -->
  <!-- + Google Fonts inline 字体。所有 generic family resolve 必然命中     -->
  <!-- 苹果字体，不再有候选排序混乱。                                       -->
  <!--                                                                      -->
  <!-- 保留：Noto Color Emoji（不 reject 否则 emoji 渲染全断）              -->
  <!--                                                                      -->
  <!-- ⚠️ 副作用：所有依赖 fontconfig 的应用都看不到这些字体了。NoDesign     -->
  <!-- server 独占场景 OK；如这台 server 上还跑别的应用要小心。              -->
  <!-- ══════════════════════════════════════════════════════════════════ -->
  <selectfont>
    <rejectfont>
      <!-- DejaVu 系列（Debian 默认 latin） -->
      <pattern><patelt name="family"><string>DejaVu Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>DejaVu Math TeX Gyre</string></patelt></pattern>

      <!-- Liberation 系列（RHEL 系 latin） -->
      <pattern><patelt name="family"><string>Liberation Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Liberation Sans Narrow</string></patelt></pattern>

      <!-- Noto 系列（latin + CJK 都 reject，让苹果字体接管） -->
      <pattern><patelt name="family"><string>Noto Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Sans CJK KR</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK SC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK TC</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK JP</string></patelt></pattern>
      <pattern><patelt name="family"><string>Noto Serif CJK KR</string></patelt></pattern>
      <!-- Noto Color Emoji 故意保留——emoji 渲染必需 -->

      <!-- 文泉驿系列（Debian 中文 fallback） -->
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Micro Hei</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>WenQuanYi Zen Hei Sharp</string></patelt></pattern>

      <!-- GNU FreeFont 系列 -->
      <pattern><patelt name="family"><string>FreeSans</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeSerif</string></patelt></pattern>
      <pattern><patelt name="family"><string>FreeMono</string></patelt></pattern>

      <!-- Ubuntu 自带（如果是 Ubuntu server） -->
      <pattern><patelt name="family"><string>Ubuntu</string></patelt></pattern>
      <pattern><patelt name="family"><string>Ubuntu Mono</string></patelt></pattern>
      <pattern><patelt name="family"><string>Ubuntu Condensed</string></patelt></pattern>

      <!-- Bitstream / Vera（X11 老字体） -->
      <pattern><patelt name="family"><string>Bitstream Vera Sans</string></patelt></pattern>
      <pattern><patelt name="family"><string>Bitstream Vera Serif</string></patelt></pattern>
      <pattern><patelt name="family"><string>Bitstream Vera Sans Mono</string></patelt></pattern>
    </rejectfont>
  </selectfont>

</fontconfig>
