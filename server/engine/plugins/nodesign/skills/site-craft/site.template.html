<!--
  NoDesign · 站点起手模板（site-craft）

  拷进 index.html 后改写。子页照抄这份骨架，只换 <main> 里的内容。

  三件事别动结构：
    1. <head> 里的 meta viewport（没有它移动端会按 980px 虚拟视口渲染，
       媒体查询看着"没生效"，其实是视口不对）
    2. <link rel="stylesheet" href="style.css">  —— 全站共用一份样式表
    3. 站内链接一律相对路径（about.html），**绝不用 /about.html**：
       预览走的是 /api/projects/<id>/artifact-file/tasks/<任务>/… 这个前缀，
       根路径会跳出前缀直接 404

  图片引用项目素材写 ../../assets/generated/x.png（相对本文件的位置）。
  导出时系统会把它归一成包内的 assets/，不用你操心。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{站点标题 · 改我}</title>
  <meta name="description" content="{一句话说清这是什么 · 改我}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-head">
    <a class="site-title" href="index.html">{站名}</a>
    <nav class="site-nav">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
    </nav>
  </header>

  <main>
    <section class="lede">
      <h1>{一句话说清这是什么}</h1>
      <p>{两三句展开。不要写"欢迎来到"，直接说事。}</p>
    </section>

    <section>
      <h2>{小标题}</h2>
      <p>{正文。中文标点用全角。}</p>
    </section>
  </main>

  <footer class="site-foot">
    <p>{页脚一句话}</p>
  </footer>

</body>
</html>
