<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 隐私声明：平台据它把标注里的文本剥成占位符再发给 agent。
     演出.js 发现没有会自己补一条，但**自己写上更好**（不依赖脚本跑起来） -->
<meta name="nd-privacy" content="演出">
<title>演出</title>
<style>
  /* ── 这一整块是"皮肤"，按题材整个重画：字体、色纸、气泡形态都是戏的一部分 ── */
  :root { --纸: #F4EFE4; --墨: #2B2117; --淡: #8A7A62; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column;
    background: var(--纸); color: var(--墨);
    font: 16px/1.85 "Songti SC", "Noto Serif CJK SC", serif; }
  #台 { flex: 1; overflow-y: auto; padding: 24px 18px 8px; max-width: 720px; width: 100%; margin: 0 auto; }
  .回合 { margin: 0 0 18px; white-space: pre-wrap; }
  .回合.用户 { color: var(--淡); }
  .回合.用户::before { content: "› "; }
  .等::after { content: "…"; opacity: .5; }
  .提示, .出错 { font-size: 13px; margin: 10px 0; }
  .提示 { color: var(--淡); }
  .出错 { color: #A8362B; }
  form { display: flex; gap: 10px; padding: 12px 18px 18px; max-width: 720px; width: 100%; margin: 0 auto; }
  textarea { flex: 1; resize: none; height: 44px; padding: 10px 12px; font: inherit; font-size: 15px;
    background: #fff8; border: 1px solid #0002; border-radius: 2px; outline: none; color: inherit; }
  button { padding: 0 18px; font: inherit; font-size: 14px; letter-spacing: .2em;
    background: var(--墨); color: var(--纸); border: 0; border-radius: 2px; cursor: pointer; }
  button:disabled { background: var(--淡); cursor: default; }
</style>
</head>
<body>
  <div id="台"></div>
  <form id="条" autocomplete="off">
    <textarea id="输入" rows="1" placeholder="你做什么、说什么…"></textarea>
    <button id="发送" type="submit">进</button>
  </form>

<!-- ⚠️ classic script，**不要写 type="module"**：agent 自检截图走 file://，
     ES module 在 file: 下会被当跨源拦掉，整页脚本一起死 -->
<script src="演出.js"></script>
<script>
  const 台 = document.getElementById('台');

  /** 皮肤只需要回答"一条消息长什么样"，管线的事一件都不用管 */
  function 条(cls, 文) {
    const el = document.createElement('div');
    el.className = cls;
    el.textContent = 文;
    台.appendChild(el);
    return el;
  }

  const 场 = ND演出.挂载({
    台,
    输入: document.getElementById('输入'),
    发送钮: document.getElementById('发送'),
    画: {
      用户: (文) => 条('回合 用户', 文),
      演出: () => {
        const el = 条('回合 演出 等', '');
        return {
          写: (全文) => { el.classList.remove('等'); el.textContent = 全文; },
          完成: (全文) => { el.classList.remove('等'); el.textContent = 全文; },
          撤: () => el.remove(),
        };
      },
      提示: (文) => 条('提示', 文),
      出错: (文) => 条('出错', 文),
    },
  });

  // 表单提交也走同一个口（回车已由 演出.js 接管，含输入法判定）
  document.getElementById('条').addEventListener('submit', (e) => { e.preventDefault(); 场.发送(); });
</script>
</body>
</html>
