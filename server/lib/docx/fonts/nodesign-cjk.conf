<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  nodesign-cjk.conf : 中文 Windows 字体名 → 服务器上真实存在的替身。
  用法：渲染进程设 FONTCONFIG_FILE=<本文件绝对路径>（per-run，不污染系统）。
  判据是「产物优先于仪器」：docx 里写的是 Windows 字体名（用户机器上是真的），
  这份映射只服务 QC 渲染；渲染观感与用户 Word 的已知偏差写进 SKILL。

  映射决策：
    宋体族   -> Noto Serif CJK SC   （衬线对衬线）
    黑体族   -> Noto Sans CJK SC    （含 微软雅黑/等线/苹方 等无衬线族）
    楷体族   -> LXGW WenKai         （真楷体）
    仿宋族   -> Noto Serif CJK SC   （已知偏差：无仿宋替身，公文渲染观感受损，见 SKILL）
    小标宋   -> Noto Serif CJK SC
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>

  <!-- ── 宋体族 → Noto Serif CJK SC ── -->
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Songti SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>STSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>华文宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- ── 小标宋（公文红头/标题） → Noto Serif CJK SC ── -->
  <match target="pattern">
    <test name="family"><string>方正小标宋简体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FZXiaoBiaoSong-B05S</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- ── 黑体族 → Noto Sans CJK SC ── -->
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei UI</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DengXian</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>等线</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>PingFang SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>苹方</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Heiti SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>华文黑体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ── 楷体族 → LXGW WenKai（真楷体） ── -->
  <match target="pattern">
    <test name="family"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>KaiTi_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Kaiti SC</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>STKaiti</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>华文楷体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>LXGW WenKai</string></edit>
  </match>

  <!-- ── 仿宋族 → Noto Serif CJK SC（已知偏差，无真仿宋替身） ── -->
  <match target="pattern">
    <test name="family"><string>FangSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>仿宋_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FangSong_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>STFangsong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>华文仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
</fontconfig>
